<style>
:root{
  --deep-blue:#0057D9; --deep-blue-dark:#003f9e; --light-blue:#4DA3FF; --ice:#eaf3ff;
  --health-green:#22C55E; --health-green-dark:#16a34a; --accent-orange:#ff6b35;
  --white:#FFFFFF; --light-gray:#F4F6FB; --mid-gray:#e2e8f0;
  --text:#1a2332; --text-soft:#5a6b82; --border:#e5eaf2;
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --shadow-md:0 8px 24px rgba(15,23,42,.09);
  --shadow-lg:0 20px 45px rgba(15,23,42,.15);
  --radius:14px; --radius-lg:22px;
  --transition:.3s cubic-bezier(.25,.8,.25,1);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:140px}
body{background:var(--light-gray);color:var(--text);line-height:1.6;overflow-x:hidden}
a{text-decoration:none;color:inherit}
ul{list-style:none}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--light-gray)}
::-webkit-scrollbar-thumb{background:#c7d2e0;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--light-blue)}
.container{max-width:1280px;margin:0 auto;padding:0 20px}

/* ✅ Acessibilidade: só para leitores de tela */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ✅ Remove o delay de 300ms de tap no mobile */
button,a,.chip,.cat-link,.header-action,.product-card,.btn,.btn-add,.btn-fav{touch-action:manipulation}

.top-bar{background:linear-gradient(90deg,var(--deep-blue-dark),var(--deep-blue));color:#fff;font-size:.82rem;padding:8px 0}
.top-bar .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top-bar-left{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.top-bar-left span,.top-bar-right a{display:inline-flex;align-items:center;gap:6px;opacity:.95;transition:opacity .2s}
.top-bar-right a:hover{opacity:1;text-decoration:underline}
.top-bar i{font-size:.85rem}

.site-header{background:#fff;position:sticky;top:0;z-index:900;box-shadow:var(--shadow-sm);border-bottom:1px solid var(--border)}
.main-header{padding:16px 0}
.main-header .container{display:grid;grid-template-columns:auto 1fr auto;gap:30px;align-items:center}
.logo-box{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo-box img{width:52px;height:52px;border-radius:14px;object-fit:cover;box-shadow:0 4px 14px rgba(0,87,217,.25)}
.logo-box .logo-text{display:flex;flex-direction:column;line-height:1.1}
.logo-box .logo-text strong{font-size:1.15rem;font-weight:800;color:var(--deep-blue);letter-spacing:.3px}
.logo-box .logo-text span{font-size:.72rem;color:var(--text-soft);text-transform:uppercase;letter-spacing:1.5px;font-weight:500}

.search-bar{position:relative;width:100%;max-width:620px;margin:0 auto}
.search-bar input{width:100%;padding:14px 130px 14px 48px;border:2px solid var(--mid-gray);border-radius:50px;font-size:.95rem;background:var(--light-gray);transition:var(--transition);outline:none;-webkit-appearance:none;appearance:none}
.search-bar input:focus{border-color:var(--deep-blue);background:#fff;box-shadow:0 0 0 4px rgba(0,87,217,.08)}
.search-bar .fa-magnifying-glass{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--text-soft);font-size:1rem;pointer-events:none}
.search-bar .search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,var(--deep-blue),var(--light-blue));color:#fff;padding:9px 22px;border-radius:50px;font-weight:600;font-size:.85rem;transition:var(--transition)}
.search-bar .search-btn:hover{filter:brightness(1.1);transform:translateY(-50%) scale(1.03)}

.header-actions{display:flex;align-items:center;gap:12px}
.header-action{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--text-soft);padding:8px 10px;border-radius:10px;transition:var(--transition);position:relative;font-weight:500}
.header-action i{font-size:1.25rem;color:var(--deep-blue)}
.header-action:hover{background:var(--ice)}
.cart-btn .cart-count{position:absolute;top:2px;right:2px;background:var(--accent-orange);color:#fff;font-size:.68rem;font-weight:700;min-width:19px;height:19px;border-radius:50%;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.cart-btn .cart-count.visible{display:flex}
.cart-btn.pulse i{animation:cartPulse .6s ease}
@keyframes cartPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25);color:var(--health-green)}}
.mobile-menu-toggle{display:none;font-size:1.4rem;color:var(--deep-blue);padding:8px;min-width:44px;min-height:44px;align-items:center;justify-content:center;border-radius:10px}
.mobile-menu-toggle:hover{background:var(--ice)}

/* ✅ Barra de categorias (agora presente no HTML) */
.category-nav{background:#fff;border-top:1px solid var(--border);padding:0}
.category-nav .container{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.category-nav .container::-webkit-scrollbar{display:none}
.cat-link{display:inline-flex;align-items:center;gap:8px;padding:14px 18px;font-size:.88rem;font-weight:500;color:var(--text-soft);white-space:nowrap;border-bottom:3px solid transparent;transition:var(--transition);flex-shrink:0;background:none;cursor:pointer}
.cat-link i{font-size:.95rem;color:var(--deep-blue)}
.cat-link:hover,.cat-link.active{color:var(--deep-blue);border-bottom-color:var(--deep-blue);background:var(--ice)}
.cat-link.highlight{color:var(--accent-orange);font-weight:600}
.cat-link.highlight i{color:var(--accent-orange)}

/* ✅ Menu mobile lateral */
.mobile-menu-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:var(--transition);z-index:1996}
.mobile-menu-overlay.active{opacity:1;visibility:visible}
.mobile-menu{position:fixed;top:0;left:0;width:82%;max-width:320px;height:100vh;height:100dvh;background:#fff;z-index:1997;transform:translateX(-100%);transition:transform .35s cubic-bezier(.25,.8,.25,1);display:flex;flex-direction:column;box-shadow:20px 0 60px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:contain}
.mobile-menu.active{transform:translateX(0)}
.mobile-menu-header{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--border);flex-shrink:0}
.mobile-menu-header strong{font-size:1.1rem;color:var(--deep-blue)}
.mobile-menu-close{width:44px;height:44px;border-radius:50%;background:var(--light-gray);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--text-soft);transition:var(--transition)}
.mobile-menu-close:hover{background:#fee2e2;color:#ef4444}
.mobile-menu ul{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px}
.mobile-menu ul a{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:12px;font-weight:500;color:var(--text);transition:var(--transition);font-size:1rem}
.mobile-menu ul a:hover,.mobile-menu ul a:active{background:var(--ice);color:var(--deep-blue)}
.mobile-menu ul a i{width:22px;text-align:center;color:var(--deep-blue);font-size:1.1rem}

.hero{background:linear-gradient(120deg,#003d99 0%,var(--deep-blue) 45%,var(--light-blue) 100%);color:#fff;padding:70px 0 90px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-100px;right:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 70%);border-radius:50%}
.hero::after{content:'';position:absolute;bottom:-150px;left:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(34,197,94,.2),transparent 70%);border-radius:50%}
.hero-inner{display:grid;grid-template-columns:1.2fr 1fr;gap:50px;align-items:center;position:relative;z-index:2}
.hero-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:7px 16px;border-radius:50px;font-size:.8rem;font-weight:600;margin-bottom:20px;border:1px solid rgba(255,255,255,.25)}
.hero h1{font-size:3.1rem;font-weight:800;line-height:1.15;margin-bottom:18px;letter-spacing:-.5px}
.hero h1 .highlight{background:linear-gradient(135deg,#a7f3d0,#22C55E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:1.1rem;opacity:.94;margin-bottom:32px;max-width:540px;line-height:1.65}
.hero-buttons{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;border-radius:50px;font-weight:600;font-size:.98rem;transition:var(--transition);cursor:pointer;border:2px solid transparent}
.btn-primary{background:var(--health-green);color:#fff;box-shadow:0 8px 22px rgba(34,197,94,.4)}
.btn-primary:hover{background:var(--health-green-dark);transform:translateY(-2px);box-shadow:0 12px 28px rgba(34,197,94,.5)}
.btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn-outline:hover{background:rgba(255,255,255,.12);border-color:#fff}

.hero-visual{position:relative;display:flex;justify-content:center;align-items:center}
.hero-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:420px}
.hero-mini{background:rgba(255,255,255,.14);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:20px;color:#fff;transition:var(--transition)}
.hero-mini:hover{background:rgba(255,255,255,.22);transform:translateY(-4px)}
.hero-mini i{font-size:1.6rem;margin-bottom:10px;display:block}
.hero-mini strong{display:block;font-size:.95rem;margin-bottom:3px}
.hero-mini span{font-size:.78rem;opacity:.85}
.hero-mini:nth-child(1) i{color:#a7f3d0}
.hero-mini:nth-child(2) i{color:#fde68a}
.hero-mini:nth-child(3) i{color:#fca5a5}
.hero-mini:nth-child(4) i{color:#a5b4fc}

.features-bar{background:#fff;padding:28px 0;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);position:relative;z-index:3;margin-top:-40px;border-radius:22px 22px 0 0}
.features-bar .container{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.feature{display:flex;align-items:center;gap:14px;padding:6px 4px}
.feature i{font-size:1.7rem;color:var(--deep-blue);flex-shrink:0;background:var(--ice);width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.feature strong{display:block;font-size:.93rem;font-weight:600;color:var(--text);line-height:1.3}
.feature span{font-size:.78rem;color:var(--text-soft)}

section{padding:60px 0}
.section-head{text-align:center;margin-bottom:40px}
.section-head .eyebrow{display:inline-block;background:var(--ice);color:var(--deep-blue);font-size:.75rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 16px;border-radius:50px;margin-bottom:14px}
.section-head h2{font-size:2.2rem;font-weight:800;color:var(--text);margin-bottom:10px;letter-spacing:-.3px}
.section-head p{color:var(--text-soft);max-width:560px;margin:0 auto;font-size:1rem}

.products-toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding:4px;scrollbar-width:none;flex:1;overscroll-behavior-x:contain}
.filter-chips::-webkit-scrollbar{display:none}
.chip{background:#fff;border:1.5px solid var(--border);color:var(--text-soft);padding:9px 18px;border-radius:50px;font-size:.85rem;font-weight:500;white-space:nowrap;transition:var(--transition);display:inline-flex;align-items:center;gap:7px;flex-shrink:0;min-height:40px}
.chip i{font-size:.85rem}
.chip:hover{border-color:var(--light-blue);color:var(--deep-blue)}
.chip.active{background:var(--deep-blue);border-color:var(--deep-blue);color:#fff;box-shadow:0 6px 16px rgba(0,87,217,.28)}
.results-info{font-size:.85rem;color:var(--text-soft);font-weight:500}

.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.product-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:var(--transition);display:flex;flex-direction:column;position:relative;border:1px solid transparent}
.product-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--ice)}
.product-badge{position:absolute;top:14px;left:14px;background:var(--accent-orange);color:#fff;font-size:.7rem;font-weight:700;padding:5px 11px;border-radius:50px;letter-spacing:.4px;z-index:2}
.product-badge.promo{background:linear-gradient(135deg,#ff6b35,#ff8a4d)}
.product-badge.new{background:var(--health-green)}
.product-image{background:linear-gradient(180deg,#fafbfe,#eef3fb);height:210px;display:flex;align-items:center;justify-content:center;padding:18px;position:relative;overflow:hidden}
.product-image img{max-height:100%;max-width:100%;object-fit:contain;transition:transform .5s cubic-bezier(.25,.8,.25,1)}
.product-card:hover .product-image img{transform:scale(1.07)}
.product-body{padding:18px;display:flex;flex-direction:column;flex:1}
.product-category-tag{font-size:.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--deep-blue);margin-bottom:6px}
.product-brand{font-size:.75rem;color:var(--text-soft);font-weight:500;margin-bottom:4px}
.product-name{font-size:.98rem;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:10px;min-height:42px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-desc{font-size:.78rem;color:var(--text-soft);line-height:1.5;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.product-price-block{margin-top:auto;margin-bottom:14px}
.product-old-price{font-size:.78rem;color:#9aa8bb;text-decoration:line-through;margin-bottom:2px}
.product-price{font-size:1.35rem;font-weight:800;color:var(--deep-blue);line-height:1}
.product-price .price-int{font-size:1.35rem;font-weight:800}.product-price .price-cents{font-size:.85rem;font-weight:700}
.product-price .label{font-size:.72rem;color:var(--text-soft);font-weight:500;margin-left:4px}
.product-actions{display:flex;gap:8px}
.btn-add{flex:1;background:linear-gradient(135deg,var(--deep-blue),var(--light-blue));color:#fff;padding:11px;border-radius:10px;font-weight:600;font-size:.85rem;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px}
.btn-add:hover{filter:brightness(1.1);box-shadow:0 6px 18px rgba(0,87,217,.35)}
.btn-add.added{background:var(--health-green)}
.btn-fav{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-soft);transition:var(--transition);flex-shrink:0}
.btn-fav:hover{border-color:#ef4444;color:#ef4444;background:#fff5f5}
.no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-soft)}
.no-results i{font-size:3rem;color:var(--mid-gray);margin-bottom:16px;display:block}
.no-results h3{color:var(--text);margin-bottom:8px}

.about-section{background:#fff}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.about-content h2{font-size:2.1rem;font-weight:800;color:var(--text);margin-bottom:18px;line-height:1.25}
.about-content h2 .accent{color:var(--deep-blue)}
.about-content p{color:var(--text-soft);margin-bottom:16px;font-size:1rem;line-height:1.7}
.about-features{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.feature-item{display:flex;align-items:center;gap:14px}
.feature-item-icon{width:48px;height:48px;border-radius:13px;background:var(--ice);color:var(--deep-blue);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.feature-item strong{display:block;font-size:.92rem;color:var(--text)}
.feature-item span{font-size:.78rem;color:var(--text-soft)}
.about-cards{display:flex;flex-direction:column;gap:20px}
.about-card{background:linear-gradient(135deg,var(--deep-blue),var(--light-blue));color:#fff;padding:32px;border-radius:var(--radius-lg);position:relative;overflow:hidden}
.about-card.green{background:linear-gradient(135deg,var(--health-green-dark),var(--health-green))}
.about-card::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:rgba(255,255,255,.1);border-radius:50%}
.about-card h3{font-size:1.3rem;font-weight:700;margin-bottom:10px;position:relative}
.about-card p{font-size:.92rem;opacity:.94;line-height:1.6;position:relative}
.about-card i{font-size:1.8rem;margin-bottom:14px;display:block;opacity:.9;position:relative}

.service-card{background:#fff;border-radius:var(--radius);padding:32px 24px;text-align:center;box-shadow:var(--shadow-sm);transition:var(--transition);border:1px solid transparent}
.service-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-md);border-color:var(--ice)}
